name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test NexusKit
        run: swift test --package-path NexusKit

      - name: Build the app
        run: >
          xcodebuild build
          -project Nexus.xcodeproj
          -scheme Nexus
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
